services:
  windows:
    image: dockurr/windows
    container_name: windows
    environment:
      VERSION: "11"
      RAM_SIZE: "6G"
      CPU_CORES: "4"
      DISK_SIZE: "32G"
      USERNAME: "Docker"
      PASSWORD: "admin"
      AUTOLOGIN: "Y"
      DISPLAY: "web"
      WIDTH: "1280"
      HEIGHT: "720"
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - "8006:8006"
      - "3389:3389/tcp"
      - "3389:3389/udp"
    volumes:
      - ./win_data:/storage
    restart: unless-stopped
